<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"></head>
<body class="login-page"><main class="auth-shell"><section class="login-card panel"><a class="back" href="/">← Volver</a><p class="eyebrow">ALTA DE USUARIO</p><h1>Crear una cuenta</h1><p class="muted">MVP académico: el rol se elige libremente para facilitar la demostración.</p><div th:if="${error}" class="flash error" th:text="${error}"></div>
<form action="/register" method="post" class="form-grid single"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nombre completo<input name="fullName" th:value="${fullName}" required></label><label>Correo<input name="email" type="email" th:value="${email}" required></label><label>Contraseña<input name="password" type="password" minlength="8" required></label><label>Rol<select name="role" required><option th:each="role:${roles}" th:value="${role}" th:text="${role.name() == 'DIRECTOR' ? 'Director técnico' : role.name() == 'COORDINATOR' ? 'Coordinador' : 'Scout'}"></option></select></label><button class="btn primary full">Crear cuenta</button></form><p class="auth-foot">¿Ya tenés cuenta? <a href="/login">Ingresar</a></p></section></main></body></html>
