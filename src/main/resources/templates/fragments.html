<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<nav th:fragment="nav" class="app-nav">
  <a class="brand" href="/app">ScoutMatch <span>01</span></a>
  <div class="nav-links">
    <a href="/players">Jugadores</a>
    <a href="/needs">Necesidades</a>
    <a href="/candidates">Seguimiento</a>
    <a th:if="${isScout}" href="/evaluations">Mis borradores</a>
  </div>
  <div class="nav-user"><span th:text="${currentUser}"></span><form action="/logout" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">Salir</button></form></div>
</nav>
<div th:fragment="flash" class="flash-stack">
  <div th:if="${success}" class="flash success" th:text="${success}"></div>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>
</div>
</body></html>
