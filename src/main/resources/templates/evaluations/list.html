<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis borradores · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div th:replace="~{fragments :: flash}"></div><section class="page-head"><div><p class="eyebrow">MESA DE TRABAJO</p><h1>Mis borradores</h1><p class="muted">Podés editarlos hasta confirmarlos. Una vez confirmados quedan inmutables.</p></div><a class="btn primary" href="/players">Elegir jugador</a></section><div class="card-grid draft-grid"><article class="panel draft-card" th:each="draft:${drafts}"><div class="item-head"><div><p class="eyebrow">BORRADOR · VERSIÓN <span th:text="${draft.version}"></span></p><h2 th:text="${draft.playerName}"></h2></div><span class="status pending">Pendiente</span></div><p class="muted" th:text="|${#temporals.format(draft.observationDate,'dd/MM/yyyy')} · ${draft.observedPosition.label()}|"></p><div class="card-actions"><a class="btn secondary" th:href="@{/evaluations/{id}/edit(id=${draft.id})}">Continuar edición</a><form th:action="@{/evaluations/{id}/confirm(id=${draft.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn primary">Confirmar</button></form></div></article><div class="empty-state small" th:if="${#lists.isEmpty(drafts)}"><span class="huge-number">00</span><h2>No tenés borradores pendientes.</h2><a class="btn secondary" href="/players">Explorar jugadores</a></div></div></main></body></html>
