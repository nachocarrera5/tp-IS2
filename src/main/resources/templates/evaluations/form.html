<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Evaluar jugador · ScoutMatch</title>
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="page">
    <div th:replace="~{fragments :: flash}"></div>
    <a class="back" th:href="@{/players/{id}(id=${player.id})}">← Volver al jugador</a>
    <section class="page-head">
        <div>
            <p class="eyebrow" th:text="${correctionOf != null ? 'NUEVA VERSIÓN' : 'INFORME DE SCOUT'}"></p>
            <h1 th:text="${player.fullName}"></h1>
            <p class="muted">El informe se guarda primero como borrador. El ranking solo utiliza evaluaciones confirmadas.</p>
        </div>
    </section>
    <form class="evaluation-layout" action="/evaluations" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="id" th:if="${evaluation != null and correctionOf == null}" th:value="${evaluation.id}">
        <input type="hidden" name="playerId" th:value="${player.id}">
        <input type="hidden" name="correctionOf" th:if="${correctionOf != null}" th:value="${correctionOf}">
        <section class="panel form-grid">
            <label>Fecha de observación
                <input name="observationDate" type="date"
                       th:value="${evaluation?.observationDate ?: #temporals.format(#temporals.createToday(),'yyyy-MM-dd')}" required>
            </label>
            <label>Posición observada
                <select name="observedPosition" required>
                    <option th:each="position:${positions}" th:value="${position}" th:text="${position.label()}"
                            th:selected="${evaluation != null ? evaluation.observedPosition == position : player.primaryPosition == position}"></option>
                </select>
            </label>
            <label>Rival<input name="opponent" th:value="${evaluation?.opponent}"></label>
            <label>Competencia<input name="competition" th:value="${evaluation?.competition}"></label>
            <label class="full">Fortalezas<textarea name="strengths" rows="3" th:text="${evaluation?.strengths}"></textarea></label>
            <label class="full">Debilidades<textarea name="weaknesses" rows="3" th:text="${evaluation?.weaknesses}"></textarea></label>
            <label class="full">Comentario general<textarea name="comment" rows="4" th:text="${evaluation?.comment}"></textarea></label>
        </section>
        <section>
            <div class="attribute-grid">
                <label class="attribute-control" th:each="attribute:${attributes}">
                    <span><strong th:text="${attribute.name}"></strong><small th:text="${attribute.category}"></small></span>
                    <input type="number" min="1" max="10" th:name="|score_${attribute.type.name()}|"
                           th:value="${evaluation != null ? evaluation.scores.get(attribute.type) : 7}" required>
                </label>
            </div>
            <div class="sticky-actions">
                <span class="muted">Escala entera de 1 a 10</span>
                <button class="btn primary">Guardar borrador</button>
            </div>
        </section>
    </form>
</main>
</body>
</html>
