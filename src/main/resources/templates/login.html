<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar · ScoutMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="login-card p-4 p-md-5 w-100">
        <a class="text-decoration-none text-light small" href="/">← Volver</a>
        <p class="eyebrow mt-5">ACCESO AL SISTEMA</p>
        <h1 class="h2 fw-bold">Ingresar a ScoutMatch</h1>
        <p class="text-secondary">Usá una de las cuentas de demostración incluidas en el README.</p>

        <div class="alert alert-danger" role="alert" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>
        <div class="alert alert-success" role="alert" th:if="${param.logout}">
            La sesión se cerró correctamente.
        </div>

        <form action="/login" method="post" class="mt-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Correo</label>
                <input class="form-control form-control-lg" id="username" name="username" type="email" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-success btn-lg w-100" type="submit">Ingresar</button>
        </form>
    </section>
</main>
</body>
</html>
