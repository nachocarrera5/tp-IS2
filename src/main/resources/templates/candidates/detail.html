<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${candidate.playerName} · Seguimiento|"></title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page narrow"><div th:replace="~{fragments :: flash}"></div><a class="back" href="/candidates">← Seguimiento</a><section class="candidate-hero"><div><p class="eyebrow" th:text="|${candidate.needTitle} · VERSIÓN ${candidate.needVersion}|"></p><h1 th:text="${candidate.playerName}"></h1><p class="lede" th:text="${candidate.club ?: 'Sin club'}"></p></div><div class="compatibility"><strong th:text="${candidate.sourcePercentage != null ? candidate.sourcePercentage + '%' : 'S/P'}"></strong><span>al seleccionar</span></div></section><section class="status-panel"><div><span>Estado actual</span><strong th:text="${candidate.status.name() == 'DETECTED' ? 'Detectado' : candidate.status.name() == 'UNDER_OBSERVATION' ? 'En observación' : candidate.status.name() == 'SHORTLISTED' ? 'Preseleccionado' : candidate.status.name() == 'RECOMMENDED' ? 'Recomendado' : 'Descartado'}"></strong></div><form th:if="${isCoordinator}" th:action="@{/candidates/{id}/status(id=${candidate.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status" required><option th:each="status:${statuses}" th:value="${status}" th:text="${status.name() == 'DETECTED' ? 'Detectado' : status.name() == 'UNDER_OBSERVATION' ? 'En observación' : status.name() == 'SHORTLISTED' ? 'Preseleccionado' : status.name() == 'RECOMMENDED' ? 'Recomendado' : 'Descartado'}"></option></select><input name="reason" placeholder="Motivo (obligatorio al descartar)"><button class="btn primary">Actualizar</button></form></section><section class="section-block"><div class="section-title"><div><p class="eyebrow">AUDITORÍA</p><h2>Historial de estados</h2></div></div><div class="timeline"><article class="timeline-item" th:each="change:${history}"><div class="timeline-mark"></div><div class="panel"><div class="item-head"><strong th:text="${change.newStatus}"></strong><span th:text="${#temporals.format(change.changedAt,'dd/MM/yyyy HH:mm')}"></span></div><p th:text="${change.reason ?: 'Sin motivo adicional.'}"></p><small th:text="|Registrado por ${change.changedBy}|"></small></div></article></div></section></main></body></html>
