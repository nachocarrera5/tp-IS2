<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div th:replace="~{fragments :: flash}"></div><a class="back" href="/needs">← Necesidades</a><section class="ranking-head"><div><p class="eyebrow">EJECUCIÓN INMUTABLE · VERSIÓN <span th:text="${execution.version}"></span></p><h1 th:text="${execution.needTitle}"></h1><p class="muted" th:text="|Ejecutada el ${#temporals.format(execution.executedAt,'dd/MM/yyyy HH:mm')} · ${execution.analyzedCount} perfiles analizados|"></p></div><div class="result-total"><strong th:text="${execution.resultCount}"></strong><span>resultados</span></div></section>
<section class="ranking-list"><article class="ranking-card" th:each="result,stat:${execution.results}"><div class="rank-position" th:text="${result.percentage != null ? stat.count : '—'}"></div><div class="ranking-main"><div class="item-head"><div><p class="eyebrow" th:text="|${result.positionMatch == 'PRIMARY' ? 'POSICIÓN PRINCIPAL' : 'POSICIÓN SECUNDARIA'} · ${result.club ?: 'SIN CLUB'}|"></p><h2><a th:href="@{/players/{id}(id=${result.playerId})}" th:text="${result.playerName}"></a></h2></div><div class="compatibility" th:classappend="${result.percentage == null ? ' pending' : ''}"><strong th:text="${result.percentage != null ? #numbers.formatDecimal(result.percentage,1,2) + '%' : 'S/P'}"></strong><span th:text="${result.status == T(ar.edu.is2.scouting.domain.search.CompatibilityStatus).PRELIMINARY ? 'Preliminar' : result.status == T(ar.edu.is2.scouting.domain.search.CompatibilityStatus).PENDING_EVALUATION ? 'Pendiente de evaluación' : result.status == T(ar.edu.is2.scouting.domain.search.CompatibilityStatus).INSUFFICIENT_DATA ? 'Datos insuficientes' : 'Compatibilidad'}"></span></div></div><div class="evidence-line"><span th:text="|${result.scoutCount} scouts|"></span><span th:text="|${result.evaluationCount} evaluaciones|"></span><span th:text="${result.lastEvaluation != null ? 'Última: ' + #temporals.format(result.lastEvaluation,'dd/MM/yyyy') : 'Sin observaciones'}"></span><span th:if="${result.alternativePosition}" class="warning">Posición alternativa</span></div><div class="breakdown" th:if="${!#lists.isEmpty(result.breakdown)}"><div th:each="detail:${result.breakdown}"><span th:text="${detail.attribute.label()}"></span><div class="bar"><i th:style="|width:${detail.playerScore * 10}%|"></i></div><strong th:text="|${detail.playerScore} / ${detail.targetValue}|"></strong><small th:text="|peso ${detail.weight}|"></small></div></div><div class="card-actions" th:if="${isCoordinator}"><form th:if="${!result.candidate}" th:action="@{/rankings/results/{id}/select(id=${result.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="executionId" th:value="${execution.id}"><button class="btn primary">Incorporar al seguimiento</button></form><span class="status good" th:if="${result.candidate}">En seguimiento</span></div></div></article><div class="empty-state small" th:if="${#lists.isEmpty(execution.results)}"><span class="huge-number">00</span><h2>Ningún jugador superó los filtros.</h2></div></section><p class="disclaimer">El porcentaje es orientativo y no representa una decisión automática de contratación.</p></main></body></html>
