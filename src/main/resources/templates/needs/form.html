<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definir necesidad · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"><script src="/js/position-attributes.js" defer></script></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><a class="back" href="/needs">← Necesidades</a><section class="page-head"><div><p class="eyebrow">TRADUCCIÓN DEL PEDIDO</p><h1 th:text="${need != null ? 'Crear nueva versión' : 'Nueva necesidad'}"></h1><p class="muted">Los pesos se normalizan automáticamente; un mínimo solo excluye si lo completás.</p></div></section><div th:if="${error}" class="flash error" th:text="${error}"></div>
<form th:action="${need != null ? '/needs/' + need.id + '/version' : '/needs'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><section class="panel form-grid"><label class="full">Título<input name="title" th:value="${need?.title ?: input?.title}" placeholder="Volante central de buen pie" required></label><label class="full">Descripción<textarea name="description" rows="3" th:text="${need?.description ?: input?.description}"></textarea></label><label>Posición buscada<select name="position" data-attribute-position-filter required><option th:each="position:${positions}" th:value="${position}" th:text="${position.label()}" th:selected="${need != null ? need.position == position : input?.position == position}"></option></select></label><label>Liga<input name="league" th:value="${need?.league}"></label><label>Edad mínima<input name="minimumAge" type="number" min="15" max="60" th:value="${need?.minimumAge}"></label><label>Edad máxima<input name="maximumAge" type="number" min="15" max="60" th:value="${need?.maximumAge}"></label><label>Nacionalidad<input name="nationality" th:value="${need?.nationality}"></label><label>Pie dominante<select name="preferredFoot"><option value="">Cualquiera</option><option value="RIGHT" th:selected="${need?.preferredFoot == 'RIGHT'}">Derecho</option><option value="LEFT" th:selected="${need?.preferredFoot == 'LEFT'}">Izquierdo</option><option value="BOTH" th:selected="${need?.preferredFoot == 'BOTH'}">Ambos</option></select></label></section>
<section class="section-block"><div class="section-title"><div><p class="eyebrow">PERFIL OBJETIVO</p><h2>Criterios deportivos</h2></div><span class="muted">La lista cambia según la posición</span></div><div class="criteria-builder"><article class="criterion-card" data-attribute-option th:attr="data-goalkeeper-only=${attribute.category == 'GOALKEEPER'}, data-goalkeeper-shared=${attribute.type.name() == 'AERIAL_PLAY'}" th:each="attribute:${attributes}"><label class="criterion-toggle"><input type="checkbox" name="selectedAttributes" data-attribute-selection th:value="${attribute.type}" th:checked="${selectedCriteria != null and selectedCriteria.contains(attribute.type)}"><span><strong th:text="${attribute.name}"></strong><small th:text="${attribute.description}"></small></span></label><div class="criterion-values"><label>Objetivo<input type="number" min="1" max="10" th:name="|target_${attribute.type.name()}|" th:value="${criterionTargets != null and criterionTargets.containsKey(attribute.type) ? criterionTargets.get(attribute.type) : 8}"></label><label>Peso<input type="number" min="1" max="5" th:name="|weight_${attribute.type.name()}|" th:value="${criterionWeights != null and criterionWeights.containsKey(attribute.type) ? criterionWeights.get(attribute.type) : 3}"></label><label>Mínimo<input type="number" min="1" max="10" th:name="|minimum_${attribute.type.name()}|" th:value="${criterionMinimums != null ? criterionMinimums.get(attribute.type) : null}" placeholder="—"></label></div></article></div></section><div class="sticky-actions"><a class="btn secondary" href="/needs">Cancelar</a><button class="btn primary" th:text="${need != null ? 'Crear versión' : 'Guardar necesidad'}"></button></div></form></main></body></html>
