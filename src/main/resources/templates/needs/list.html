<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Necesidades · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div th:replace="~{fragments :: flash}"></div><section class="page-head"><div><p class="eyebrow">BÚSQUEDAS REPRODUCIBLES</p><h1>Necesidades deportivas</h1><p class="muted">Cada versión conserva sus criterios, ejecuciones y decisiones.</p></div><a th:if="${isCoordinator or isDirector}" class="btn primary" href="/needs/new">+ Nueva necesidad</a></section><div class="need-grid"><a class="need-card" th:each="need:${needs}" th:href="@{/needs/{id}(id=${need.id})}"><div class="item-head"><span class="status" th:classappend="${need.status == 'ACTIVE' ? ' good' : ''}" th:text="${need.status == 'ACTIVE' ? 'Activa' : 'Cerrada'}"></span><span th:text="|v${need.version}|"></span></div><p class="eyebrow" th:text="${need.position.label()}"></p><h2 th:text="${need.title}"></h2><p class="muted clamp" th:text="${need.description ?: 'Sin descripción adicional.'}"></p><div class="need-stats"><span><strong th:text="${#lists.size(need.criteria)}"></strong> criterios</span><span><strong th:text="${need.executionCount}"></strong> ejecuciones</span><span><strong th:text="${need.candidateCount}"></strong> candidatos</span></div></a><div class="empty-state small" th:if="${#lists.isEmpty(needs)}"><span class="huge-number">01</span><h2>La primera búsqueda empieza con un pedido claro.</h2></div></div></main></body></html>
