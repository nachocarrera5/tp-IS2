<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${need.title} · ScoutMatch|"></title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div th:replace="~{fragments :: flash}"></div><a class="back" href="/needs">← Necesidades</a><section class="page-head"><div><div class="tag-row"><span class="status" th:classappend="${need.status == 'ACTIVE' ? ' good' : ''}" th:text="${need.status == 'ACTIVE' ? 'Activa' : 'Cerrada'}"></span><span class="tag" th:text="|Versión ${need.version}|"></span></div><h1 th:text="${need.title}"></h1><p class="lede" th:text="${need.description ?: 'Sin descripción adicional.'}"></p></div><div class="actions" th:if="${(isCoordinator or isDirector) and need.status == 'ACTIVE'}"><a class="btn secondary" th:href="@{/needs/{id}/version(id=${need.id})}">Nueva versión</a><form th:action="@{/needs/{id}/execute(id=${need.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn primary">Ejecutar búsqueda</button></form></div></section>
<section class="info-strip"><div><span>Posición</span><strong th:text="${need.position.label()}"></strong></div><div><span>Liga</span><strong th:text="${need.league ?: 'Cualquiera'}"></strong></div><div><span>Edad</span><strong th:text="|${need.minimumAge ?: '—'} a ${need.maximumAge ?: '—'}|"></strong></div><div><span>Pie</span><strong th:text="${need.preferredFoot ?: 'Cualquiera'}"></strong></div></section>
<section class="split-section"><div><div class="section-title"><div><p class="eyebrow">CRITERIOS · VERSIÓN ACTUAL</p><h2>Perfil buscado</h2></div></div><div class="criteria-summary"><article th:each="criterion:${need.criteria}"><div><strong th:text="${criterion.attributeName}"></strong><small th:text="|Peso ${criterion.weight}|"></small></div><span class="target" th:text="|≥ ${criterion.target}|"></span><small th:if="${criterion.minimum != null}" th:text="|Excluye bajo ${criterion.minimum}|"></small></article></div></div><aside class="quick-panel"><p class="eyebrow">HISTORIAL</p><h2 th:text="|${#lists.size(executions)} ejecuciones|"></h2><a class="list-row" th:each="execution:${executions}" th:href="@{/rankings/{id}(id=${execution.id})}"><div><strong th:text="|Ranking v${execution.version}|"></strong><span th:text="${#temporals.format(execution.executedAt,'dd/MM/yyyy HH:mm')}"></span></div><span th:text="|${execution.resultCount} resultados →|"></span></a></aside></section>
<form th:if="${(isCoordinator or isDirector) and need.status == 'ACTIVE'}" th:action="@{/needs/{id}/close(id=${need.id})}" method="post" class="danger-zone"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div><strong>Cerrar necesidad</strong><span>Las versiones, ejecuciones y candidatos no se eliminan.</span></div><button class="btn danger">Cerrar</button></form></main></body></html>
