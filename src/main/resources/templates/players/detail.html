<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${player.fullName} · ScoutMatch|"></title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div th:replace="~{fragments :: flash}"></div><a class="back" href="/players">← Jugadores</a><section class="player-hero"><div class="shirt-number" th:text="${player.id < 10 ? '0' + player.id : player.id}"></div><div><p class="eyebrow" th:text="${player.externalId ?: 'PERFIL INTERNO'}"></p><h1 th:text="${player.fullName}"></h1><p class="lede" th:text="|${player.club ?: 'Sin club'} · ${player.league ?: 'Liga no informada'}|"></p><div class="tag-row"><span class="tag accent" th:text="${player.primaryPosition.label()}"></span><span class="tag" th:each="position:${player.secondaryPositions}" th:text="${position.label()}"></span></div></div><div class="actions"><a th:if="${isCoordinator}" class="btn secondary" th:href="@{/players/{id}/edit(id=${player.id})}">Editar ficha</a><a th:if="${isScout}" class="btn primary" th:href="@{/evaluations/new(playerId=${player.id})}">+ Evaluar</a></div></section>
<section class="info-strip"><div><span>Edad</span><strong th:text="|${player.age()} años|"></strong></div><div><span>Nacimiento</span><strong th:text="${#temporals.format(player.birthDate,'dd/MM/yyyy')}"></strong></div><div><span>Nacionalidad</span><strong th:text="${player.nationality ?: '—'}"></strong></div><div><span>Pie dominante</span><strong th:text="${player.preferredFoot == 'LEFT' ? 'Izquierdo' : player.preferredFoot == 'RIGHT' ? 'Derecho' : player.preferredFoot == 'BOTH' ? 'Ambos' : '—'}"></strong></div></section>
<section class="section-block"><div class="section-title"><div><p class="eyebrow">TRAZABILIDAD</p><h2>Informes de scouting</h2></div><span class="count-badge" th:text="${#lists.size(evaluations)}"></span></div><div class="timeline"><article class="timeline-item" th:each="evaluation:${evaluations}"><div class="timeline-mark"></div><div class="panel"><div class="item-head"><div><strong th:text="|${evaluation.competition ?: 'Observación'} · ${evaluation.opponent ?: 'rival no informado'}|"></strong><span th:text="|${evaluation.scoutName} · ${#temporals.format(evaluation.observationDate,'dd/MM/yyyy')}|"></span></div><span class="status" th:classappend="${evaluation.status == 'CONFIRMED' ? ' good' : ''}" th:text="${evaluation.status == 'CONFIRMED' ? 'Confirmada' : 'Borrador'}"></span></div><p th:text="${evaluation.comment ?: 'Sin comentario general.'}"></p><div class="score-chips"><span th:each="score:${evaluation.scores}" th:text="|${score.key.label()} ${score.value}|"></span></div><a th:if="${isScout and evaluation.status == 'CONFIRMED'}" class="text-link" th:href="@{/evaluations/{id}/correct(id=${evaluation.id})}">Crear corrección →</a></div></article><div class="empty-inline" th:if="${#lists.isEmpty(evaluations)}">Este jugador todavía no tiene evaluaciones.</div></div></section></main></body></html>
