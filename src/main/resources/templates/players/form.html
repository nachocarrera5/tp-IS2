<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha de jugador · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page narrow"><a class="back" href="/players">← Volver</a><section class="page-head"><div><p class="eyebrow">GESTIÓN DE JUGADORES</p><h1 th:text="${player != null ? 'Editar ficha' : 'Registrar jugador'}"></h1><p class="muted">Nombre, nacimiento y posición principal son obligatorios.</p></div></section><div th:if="${error}" class="flash error" th:text="${error}"></div>
<form class="panel form-grid" th:action="${player != null ? '/players/' + player.id : '/players'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nombre completo<input name="fullName" th:value="${player?.fullName ?: input?.fullName}" required></label><label>Identificador externo<input name="externalId" th:value="${player?.externalId ?: input?.externalId}" placeholder="ARG-1024"></label><label>Fecha de nacimiento<input name="birthDate" type="date" th:value="${player?.birthDate ?: input?.birthDate}" required></label><label>Nacionalidad<input name="nationality" th:value="${player?.nationality ?: input?.nationality}"></label><label>Club<input name="club" th:value="${player?.club ?: input?.club}"></label><label>Liga<input name="league" th:value="${player?.league ?: input?.league}"></label><label>Pie dominante<select name="preferredFoot"><option value="">Sin informar</option><option value="RIGHT" th:selected="${player?.preferredFoot == 'RIGHT'}">Derecho</option><option value="LEFT" th:selected="${player?.preferredFoot == 'LEFT'}">Izquierdo</option><option value="BOTH" th:selected="${player?.preferredFoot == 'BOTH'}">Ambos</option></select></label><label>Posición principal<select name="primaryPosition" required><option th:each="position:${positions}" th:value="${position}" th:text="${position.label()}" th:selected="${player?.primaryPosition == position}"></option></select></label><fieldset class="full"><legend>Posiciones secundarias</legend><div class="check-grid"><label class="check-option" th:each="position:${positions}"><input type="checkbox" name="secondaryPositions" th:value="${position}" th:checked="${player != null and player.secondaryPositions.contains(position)}"><span th:text="${position.label()}"></span></label></div></fieldset><div class="full form-actions"><a class="btn secondary" href="/players">Cancelar</a><button class="btn primary">Guardar ficha</button></div></form></main></body></html>
