<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugadores · ScoutMatch</title><link href="/css/app.css" rel="stylesheet"></head><body><header th:replace="~{fragments :: nav}"></header><main class="page"><div th:replace="~{fragments :: flash}"></div><section class="page-head"><div><p class="eyebrow">BASE DE SCOUTING</p><h1>Jugadores</h1><p class="muted">Perfiles deportivos y evidencia reunida por el equipo.</p></div><div class="actions" th:if="${isCoordinator}"><a class="btn secondary" href="/players/import">Importar CSV</a><a class="btn primary" href="/players/new">+ Registrar jugador</a></div></section>
<form class="search-bar" action="/players"><input name="q" th:value="${q}" placeholder="Buscar por jugador o club"><button class="btn secondary">Buscar</button></form>
<section class="data-table"><div class="table-head"><span>Jugador</span><span>Contexto</span><span>Posición</span><span>Evidencia</span><span></span></div><a class="table-row" th:each="player:${players}" th:href="@{/players/{id}(id=${player.id})}"><div><strong th:text="${player.fullName}"></strong><small th:text="${player.nationality ?: 'Nacionalidad sin informar'}"></small></div><div><span th:text="${player.club ?: 'Libre / sin club'}"></span><small th:text="${player.league ?: 'Liga sin informar'}"></small></div><div><span class="tag" th:text="${player.primaryPosition.label()}"></span><small th:text="|${player.age()} años · ${player.preferredFoot ?: 'pie s/d'}|"></small></div><div><strong th:text="|${player.evaluationCount} informes|"></strong></div><span class="arrow">→</span></a><div class="empty-inline" th:if="${#lists.isEmpty(players)}">No encontramos jugadores con ese criterio.</div></section></main></body></html>
